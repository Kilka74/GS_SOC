batch_size: 128
epochs: 200
lr_min: 0.0
lr_max: 0.1
momentum: 0.9
seed: 42
out_dir: standard
dataset: cifar100
data_dir: ./cifar100-data
wandb_key: 
lr_scheduler: multistep
model_name: resnet18
activation: relu
weight_decay: 5e-4
conv_layer: monarch_soc
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +groups: 4, 8, 16, 32