batch_size: 128
lr_max: 0.1
momentum: 0.9
epsilon: 36
seed: 42
dataset: cifar10
data_dir: ./cifar10-data-3
wandb_key: 
lr_scheduler: multistep
model_name: LipConvnet
init_channels: 32
activation: maxmin
weight_decay: 5e-4
block_size: 1 2 3 4 5
hydra:
  mode: MULTIRUN
  sweeper:
    params:
      +conv_layer: monarch_soc, soc, permuted_soc, reversed_monarch_soc
      +groups: 4 4, 1, 4, 8, 16, 8 8, 16 16